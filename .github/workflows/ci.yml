name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret and identifier scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/check_no_secrets.py

  python:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -r projects/02-contact-list-merge/requirements.txt pytest-cov
      - name: Unit, integration and golden-file tests (coverage gate 90%)
        working-directory: projects/02-contact-list-merge
        run: python -m pytest --cov=pipeline --cov-report=term-missing --cov-fail-under=90

  sequencer:
    name: Outreach Sequencer tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -r projects/03-outreach-sequencer/requirements.txt pytest-cov
      - name: Unit, integration and golden-file tests (coverage gate 90%)
        working-directory: projects/03-outreach-sequencer
        run: python -m pytest --cov=sequencer --cov-report=term-missing --cov-fail-under=90

  contact-app:
    name: Contact Cleaning App tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -r projects/04-contact-cleaning-app/requirements.txt
      - name: Unit, integration and HTTP tests (coverage gate 90%)
        working-directory: projects/04-contact-cleaning-app
        run: python -m pytest --cov=contactapp --cov-report=term-missing --cov-fail-under=90

  waterfall:
    name: Enrichment Waterfall tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install pytest pytest-cov
      - name: Unit tests (coverage gate 90%)
        working-directory: projects/16-enrichment-waterfall
        run: python -m pytest --cov=waterfall --cov-report=term-missing --cov-fail-under=90

  data-projects:
    name: ${{ matrix.project }} (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        project: [07-pql-scorer, 09-attribution-engine, 11-churn-alert-system, 17-signal-fit-scoring, 20-gtm-automation-hub]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -r projects/${{ matrix.project }}/requirements.txt
      - name: Offline tests (coverage gate 80%)
        working-directory: projects/${{ matrix.project }}
        run: |
          case "${{ matrix.project }}" in
            07-*) pkg=pql ;; 09-*) pkg=attribution ;; 11-*) pkg=churnalert ;; 17-*) pkg=fitscore ;; 20-*) pkg=hub ;;
          esac
          python -m pytest --cov=$pkg --cov-report=term-missing --cov-fail-under=80

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff==0.7.3
      - run: ruff check projects

  workflow:
    name: n8n workflow is current and matches the reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r projects/02-contact-list-merge/requirements.txt
      - name: Rebuild workflow JSON from n8n/src
        working-directory: projects/02-contact-list-merge
        run: python n8n/build_workflow.py
      - name: Fail if the committed workflow JSON is stale
        run: git diff --exit-code -- projects/02-contact-list-merge/workflow
      - name: Run the generated Code nodes and diff against golden output
        working-directory: projects/02-contact-list-merge
        run: python scripts/parity_check.py
      - name: Workflow JSON files are valid
        run: |
          for f in projects/*/workflow/*.json; do python -m json.tool "$f" > /dev/null && echo "ok $f"; done

  notebook:
    name: Walkthrough notebook runs end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r projects/02-contact-list-merge/requirements.txt -r projects/02-contact-list-merge/requirements-notebook.txt
      - name: Execute every cell (includes the JS/Python parity cell)
        working-directory: projects/02-contact-list-merge
        run: python -m pytest --nbmake notebooks/walkthrough.ipynb
