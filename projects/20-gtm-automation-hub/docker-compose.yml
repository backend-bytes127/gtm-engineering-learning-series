# An isolated n8n for this project only: its own container, its own volume, reachable from this machine only.
# Same pinned image as infra/docker-compose.yml. It does not share anything with that stack.
name: gtm-hub
services:
  n8n:
    image: n8nio/n8n:2.32.6
    container_name: ${GTM_HUB_CONTAINER:-gtm-hub-n8n}
    ports:
      - "127.0.0.1:${GTM_HUB_PORT:-5690}:5678"   # never remove 127.0.0.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"                 # plain http on localhost only
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      # Both settings widen what workflow code can do. Acceptable only because this instance runs nothing else.
      # One production execution at a time. Without this, parallel requests bypass replay and dedupe (reports/e2e.md).
      N8N_CONCURRENCY_PRODUCTION_LIMIT: ${GTM_HUB_CONCURRENCY:-1}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto        # HMAC inside Code nodes
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"      # Code nodes and expressions read the settings below
      GTM_HUB_WEBHOOK_SECRET: ${GTM_HUB_WEBHOOK_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_APPROVER_IDS: ${SLACK_APPROVER_IDS:-}
      # The default is the local fake (python -m hub.fake_slack), so nothing reaches Slack until you change it.
      GTM_HUB_SLACK_WEBHOOK_URL: ${GTM_HUB_SLACK_WEBHOOK_URL:-http://host.docker.internal:8787/slack}
      GTM_HUB_RESPONSE_URL_PREFIX: ${GTM_HUB_RESPONSE_URL_PREFIX:-https://hooks.slack.com/}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
    volumes:
      - hub_data:/home/node/.n8n
      - ./workflows:/workflows:ro
      - ${GTM_HUB_INBOX:-./samples/inbox}:/home/node/.n8n-files/inbox:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  hub_data:
    name: ${GTM_HUB_VOLUME:-gtm-hub-n8n-data}
